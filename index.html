<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mistral AI Web Client</title>
    
    <!-- Dependencies: Marked (Markdown) & Highlight.js (Code Highlighting) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" id="hljs-theme">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
            --user-msg: #1e3a8a;
            --ai-msg: #1e293b;
            --error: #ef4444;
            --success: #10b981;
            --radius-lg: 12px;
            --radius-md: 8px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --spinner-filter: invert(1);
        }

        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --user-msg: #dbeafe;
            --ai-msg: #f1f5f9;
            --spinner-filter: none;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        /* Layout */
        #sidebar {
            width: 300px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        #main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        /* Sidebar UI */
        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); }
        .btn-secondary:hover { opacity: 0.9; }
        .btn-danger { background: var(--error); color: white; }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .chat-item {
            padding: 0.75rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-secondary);
        }

        .chat-item:hover, .chat-item.active {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .chat-item-actions { display: none; gap: 0.25rem; }
        .chat-item:hover .chat-item-actions { display: flex; }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 2px 4px;
            font-size: 0.9rem;
        }
        .icon-btn:hover { color: var(--text-primary); }

        /* Controls Panel */
        .controls-panel {
            padding: 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            font-size: 0.85rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        input, select, textarea {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 0.5rem;
            border-radius: var(--radius-md);
            outline: none;
        }

        /* Styled Number Input Arrows to Match Theme */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            filter: var(--spinner-filter);
            cursor: pointer;
            opacity: 0.8;
        }
        input[type="number"]::-webkit-inner-spin-button:hover,
        input[type="number"]::-webkit-outer-spin-button:hover {
            opacity: 1;
        }

        /* Chat Window */
        .chat-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-secondary);
        }

        #messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.user { align-self: flex-end; }
        .message-row.assistant { align-self: flex-start; }

        .message-bubble {
            padding: 1rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .user .message-bubble { background: var(--user-msg); border-bottom-right-radius: 2px; }
        .assistant .message-bubble { background: var(--ai-msg); border-bottom-left-radius: 2px; }

        .message-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.4rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .message-actions {
            margin-top: 0.25rem;
            display: flex;
            gap: 0.5rem;
        }

        /* Input Area */
        .input-container {
            padding: 1rem;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-box-wrapper {
            display: flex;
            gap: 0.5rem;
            align-items: flex-end;
        }

        #user-input {
            flex: 1;
            resize: none;
            max-height: 200px;
            min-height: 48px;
            padding: 0.75rem;
        }

        /* Markdown Formatting Fixes */
        .message-bubble ul, .message-bubble ol {
            padding-left: 1.5rem;
            margin: 0.5rem 0;
            max-width: 100%;
        }
        .message-bubble code {
            background: rgba(0,0,0,0.2);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: monospace;
        }
        .message-bubble pre {
            margin: 0.5rem 0;
            border-radius: var(--radius-md);
            overflow-x: auto;
        }
        .message-bubble pre code {
            padding: 1rem;
            display: block;
        }

        /* UI Enhancements */
        .compact .message-bubble { padding: 0.5rem 0.75rem; }
        .compact #messages-container { gap: 0.75rem; }
        .system-msg { align-self: center; background: var(--bg-tertiary); font-size: 0.85rem; max-width: 90%; }
        .hidden { display: none !important; }
        
        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(2px);
        }

        .modal-card {
            background: var(--bg-secondary);
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            width: 440px;
            max-width: 90vw;
            max-height: 85vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.25rem;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
            border-radius: 4px;
        }
        .close-btn:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: 200px; }
            .message-row { max-width: 95%; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            <button class="btn" style="flex:1;" onclick="createNewChat()">+ New Chat</button>
            <button class="btn btn-secondary" onclick="toggleSettingsModal()">⚙️ Settings</button>
        </div>
        
        <div class="chat-list" id="chat-list"></div>

        <!-- Model Control (Remains outside Settings) -->
        <div class="controls-panel">
            <div class="control-group">
                <label>Model</label>
                <select id="model-select">
                    <option value="mistral-tiny">mistral-tiny</option>
                    <option value="mistral-small-latest" selected>mistral-small-latest</option>
                    <option value="mistral-medium-latest">mistral-medium-latest</option>
                    <option value="mistral-large-latest">mistral-large-latest</option>
                </select>
            </div>

            <div class="control-group">
                <label>Temperature (<span id="temp-val">0.7</span>)</label>
                <input type="range" id="temperature" min="0" max="1" step="0.1" value="0.7">
            </div>
        </div>
    </div>

    <!-- Main Chat Window -->
    <div id="main-chat">
        <div class="chat-header">
            <span id="current-chat-title" style="font-weight: bold;">New Chat</span>
        </div>

        <div id="messages-container"></div>

        <div class="input-container">
            <div class="input-box-wrapper">
                <textarea id="user-input" placeholder="Type a message... (Enter to send, Shift+Enter for new line)"></textarea>
                <button id="send-btn" class="btn" onclick="sendMessage()">Send</button>
                <button id="stop-btn" class="btn btn-danger hidden" onclick="stopGeneration()">Stop</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>⚙️ Settings & Options</h3>
                <button class="close-btn" onclick="toggleSettingsModal(false)" title="Close Settings">✕</button>
            </div>
            
            <div class="control-group">
                <label>API Key</label>
                <input type="password" id="api-key" placeholder="Paste Mistral API Key">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
                    <label style="font-size:0.75rem"><input type="checkbox" id="remember-key"> Remember Key</label>
                    <button class="btn btn-secondary" style="padding: 2px 6px; font-size:0.75rem" onclick="validateKey()">Save & Validate</button>
                </div>
            </div>

            <hr style="border-color: var(--border);">

            <div class="control-group">
                <label>Custom Daily Token Limit (0 = Unlimited)</label>
                <input type="number" id="token-limit-input" placeholder="e.g. 50000 or 0 for infinite" min="0">
                <span style="font-size:0.75rem; color:var(--text-secondary);">Leave at 0 for completely unlimited generation.</span>
            </div>

            <div class="control-group">
                <label><input type="checkbox" id="toggle-show-tokens" checked> Show token usage on messages</label>
            </div>

            <hr style="border-color: var(--border);">

            <div class="control-group">
                <label>System Prompt (Current Chat)</label>
                <textarea id="system-prompt" rows="2" placeholder="You are a helpful assistant..."></textarea>
            </div>

            <div class="control-group">
                <label><input type="checkbox" id="toggle-autoscroll" checked> Auto-scroll to bottom</label>
            </div>
            <div class="control-group">
                <label><input type="checkbox" id="toggle-compact"> Compact Message UI</label>
            </div>
            <div class="control-group">
                <label><input type="checkbox" id="toggle-hidesystem"> Hide System Messages in UI</label>
            </div>

            <hr style="border-color: var(--border);">

            <div style="display: flex; gap: 0.5rem;">
                <button class="btn btn-secondary" style="flex:1" onclick="exportChat()">Export Chat</button>
                <button class="btn btn-secondary" style="flex:1" onclick="importChat()">Import Chat</button>
                <button class="btn btn-secondary" onclick="toggleTheme()">🌓 Theme</button>
            </div>

            <div style="display: flex; justify-content: space-between; margin-top:0.5rem;">
                <button class="btn btn-danger" onclick="clearCurrentChat()">Clear Messages</button>
                <button class="btn" onclick="saveAndCloseSettings()">Done</button>
            </div>
        </div>
    </div>

    <script>
        // State Management
        let state = {
            apiKey: "",
            chats: [],
            currentChatId: null,
            customLimit: 0, // 0 = Infinite
            showTokenUsage: true,
            tokensUsedToday: 0,
            lastTokenResetDate: new Date().toDateString(),
            autoScroll: true,
            compactMode: false,
            hideSystem: false,
            abortController: null
        };

        // DOM Elements
        const messagesContainer = document.getElementById('messages-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const stopBtn = document.getElementById('stop-btn');
        const chatListEl = document.getElementById('chat-list');

        // Initialization
        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            setupEventListeners();

            if (state.chats.length === 0) {
                createNewChat();
            } else {
                switchChat(state.chats[0].id);
            }

            // First-time key check prompt
            if (!state.apiKey) {
                toggleSettingsModal(true);
            }
        });

        function loadState() {
            const savedState = localStorage.getItem('mistral_app_state');
            if (savedState) {
                const parsed = JSON.parse(savedState);
                state.chats = parsed.chats || [];
                state.customLimit = parsed.customLimit ?? 0;
                state.showTokenUsage = parsed.showTokenUsage ?? true;
                state.tokensUsedToday = parsed.tokensUsedToday || 0;
                state.lastTokenResetDate = parsed.lastTokenResetDate || new Date().toDateString();
            }

            document.getElementById('token-limit-input').value = state.customLimit;
            document.getElementById('toggle-show-tokens').checked = state.showTokenUsage;

            // Check API Key persistence
            const savedKey = localStorage.getItem('mistral_api_key');
            if (savedKey) {
                document.getElementById('api-key').value = savedKey;
                document.getElementById('remember-key').checked = true;
                state.apiKey = savedKey;
            }

            // Reset daily tokens if new day
            if (new Date().toDateString() !== state.lastTokenResetDate) {
                state.tokensUsedToday = 0;
                state.lastTokenResetDate = new Date().toDateString();
                saveState();
            }
        }

        function saveState() {
            localStorage.setItem('mistral_app_state', JSON.stringify({
                chats: state.chats,
                customLimit: state.customLimit,
                showTokenUsage: state.showTokenUsage,
                tokensUsedToday: state.tokensUsedToday,
                lastTokenResetDate: state.lastTokenResetDate
            }));
        }

        function setupEventListeners() {
            // Auto expand textarea & keyboard listeners
            userInput.addEventListener('input', () => {
                userInput.style.height = 'auto';
                userInput.style.height = `${userInput.scrollHeight}px`;
            });

            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Model sliders UI display
            document.getElementById('temperature').addEventListener('input', (e) => {
                document.getElementById('temp-val').innerText = e.target.value;
            });

            // Settings toggles
            document.getElementById('toggle-autoscroll').addEventListener('change', (e) => state.autoScroll = e.target.checked);
            document.getElementById('toggle-show-tokens').addEventListener('change', (e) => {
                state.showTokenUsage = e.target.checked;
                saveState();
                renderMessages();
            });
            document.getElementById('toggle-compact').addEventListener('change', (e) => {
                state.compactMode = e.target.checked;
                document.body.classList.toggle('compact', state.compactMode);
            });
            document.getElementById('toggle-hidesystem').addEventListener('change', (e) => {
                state.hideSystem = e.target.checked;
                renderMessages();
            });
        }

        // --- API Key Validation ---
        async function validateKey() {
            const keyInput = document.getElementById('api-key').value.trim();
            if (!keyInput) return alert('Please enter an API Key.');

            try {
                const res = await fetch('https://api.mistral.ai/v1/models', {
                    headers: { 'Authorization': `Bearer ${keyInput}` }
                });
                if (res.ok) {
                    state.apiKey = keyInput;
                    if (document.getElementById('remember-key').checked) {
                        localStorage.setItem('mistral_api_key', keyInput);
                    } else {
                        localStorage.removeItem('mistral_api_key');
                    }
                    alert('API Key validated and saved successfully!');
                } else {
                    alert('Invalid API key provided.');
                }
            } catch (err) {
                alert('Network error validating key: ' + err.message);
            }
        }

        // --- Chat Management ---
        function createNewChat() {
            const newChat = {
                id: Date.now().toString(),
                title: 'New Chat',
                systemPrompt: 'You are a helpful, respectful, and honest assistant.',
                messages: []
            };
            state.chats.unshift(newChat);
            saveState();
            renderChatList();
            switchChat(newChat.id);
        }

        function switchChat(id) {
            state.currentChatId = id;
            const chat = getCurrentChat();
            if (!chat) return;
            
            document.getElementById('current-chat-title').innerText = chat.title;
            document.getElementById('system-prompt').value = chat.systemPrompt || '';
            renderChatList();
            renderMessages();
        }

        function getCurrentChat() {
            return state.chats.find(c => c.id === state.currentChatId);
        }

        function renderChatList() {
            chatListEl.innerHTML = '';
            state.chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `chat-item ${chat.id === state.currentChatId ? 'active' : ''}`;
                item.onclick = () => switchChat(chat.id);

                item.innerHTML = `
                    <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:160px;">${escapeHtml(chat.title)}</span>
                    <div class="chat-item-actions">
                        <button class="icon-btn" onclick="event.stopPropagation(); renameChat('${chat.id}')">✏️</button>
                        <button class="icon-btn" onclick="event.stopPropagation(); duplicateChat('${chat.id}')">📋</button>
                        <button class="icon-btn" onclick="event.stopPropagation(); deleteChat('${chat.id}')">🗑️</button>
                    </div>
                `;
                chatListEl.appendChild(item);
            });
        }

        function renameChat(id) {
            const chat = state.chats.find(c => c.id === id);
            const newTitle = prompt('Rename Chat:', chat.title);
            if (newTitle) {
                chat.title = newTitle;
                saveState();
                renderChatList();
                if (id === state.currentChatId) document.getElementById('current-chat-title').innerText = newTitle;
            }
        }

        function duplicateChat(id) {
            const chat = state.chats.find(c => c.id === id);
            const dup = JSON.parse(JSON.stringify(chat));
            dup.id = Date.now().toString();
            dup.title += ' (Copy)';
            state.chats.unshift(dup);
            saveState();
            renderChatList();
        }

        function deleteChat(id) {
            if (!confirm('Are you sure you want to delete this chat?')) return;
            state.chats = state.chats.filter(c => c.id !== id);
            saveState();
            if (state.chats.length === 0) {
                createNewChat();
            } else {
                switchChat(state.chats[0].id);
            }
        }

        function clearCurrentChat() {
            const chat = getCurrentChat();
            if (chat) {
                chat.messages = [];
                saveState();
                renderMessages();
            }
        }

        // --- Smooth Message Rendering (No Flashing) ---
        function renderMessages() {
            messagesContainer.innerHTML = '';
            const chat = getCurrentChat();
            if (!chat) return;

            chat.messages.forEach((msg, idx) => {
                if (msg.role === 'system' && state.hideSystem) return;
                appendMessageNode(msg, idx);
            });
            scrollToBottom();
        }

        function appendMessageNode(msg, index) {
            const row = document.createElement('div');
            row.id = `msg-${index}`;
            row.className = `message-row ${msg.role === 'system' ? 'system-msg' : msg.role}`;
            
            row.innerHTML = buildMessageHTML(msg, index);
            messagesContainer.appendChild(row);
            row.querySelectorAll('pre code').forEach((block) => hljs.highlightElement(block));
        }

        function buildMessageHTML(msg, index) {
            let parsedText = msg.role === 'assistant' ? marked.parse(msg.content) : escapeHtml(msg.content);
            const showUsage = state.showTokenUsage && msg.usage;

            return `
                <div class="message-bubble">${parsedText}</div>
                <div class="message-meta">
                    <span>${msg.timestamp || ''}</span>
                    ${showUsage ? `<span class="usage-text">${msg.usage}</span>` : ''}
                </div>
                <div class="message-actions">
                    <button class="icon-btn" onclick="copyMessage(${index})">Copy</button>
                    ${msg.role === 'assistant' ? `<button class="icon-btn" onclick="regenerateMessage(${index})">Regenerate</button>` : ''}
                    <button class="icon-btn" onclick="deleteMessage(${index})">Delete</button>
                </div>
            `;
        }

        // Direct DOM update during stream prevent screen flashes
        function updateStreamingMessageUI(index, msg) {
            let row = document.getElementById(`msg-${index}`);
            if (!row) {
                appendMessageNode(msg, index);
                row = document.getElementById(`msg-${index}`);
            }

            const bubble = row.querySelector('.message-bubble');
            if (bubble) {
                bubble.innerHTML = marked.parse(msg.content);
                row.querySelectorAll('pre code').forEach((block) => hljs.highlightElement(block));
            }

            const usageSpan = row.querySelector('.usage-text');
            if (state.showTokenUsage && msg.usage) {
                if (usageSpan) {
                    usageSpan.innerText = msg.usage;
                } else {
                    const meta = row.querySelector('.message-meta');
                    if (meta) {
                        const newUsage = document.createElement('span');
                        newUsage.className = 'usage-text';
                        newUsage.innerText = msg.usage;
                        meta.appendChild(newUsage);
                    }
                }
            }
        }

        // --- Core Chat Engine ---
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            state.apiKey = document.getElementById('api-key').value.trim();
            if (!state.apiKey) {
                alert('Please enter your Mistral API Key in Settings.');
                toggleSettingsModal(true);
                return;
            }

            const chat = getCurrentChat();
            if (!chat) return;

            // Check Custom Limit (if non-zero)
            if (state.customLimit > 0 && state.tokensUsedToday >= state.customLimit) {
                alert("Token limit reached.");
                return;
            }

            // Add user message
            const userMsg = { role: 'user', content: text, timestamp: new Date().toLocaleTimeString() };
            chat.messages.push(userMsg);
            
            if (chat.messages.length === 1) {
                chat.title = text.slice(0, 25) + (text.length > 25 ? '...' : '');
                renderChatList();
            }

            userInput.value = '';
            userInput.style.height = 'auto';
            saveState();
            renderMessages();

            await executeStream(chat);
        }

        async function executeStream(chat) {
            const systemPrompt = document.getElementById('system-prompt').value.trim();
            chat.systemPrompt = systemPrompt;

            let apiMessages = [];
            if (systemPrompt) apiMessages.push({ role: 'system', content: systemPrompt });

            const history = chat.messages.slice(-10);
            history.forEach(m => apiMessages.push({ role: m.role, content: m.content }));

            const assistantMsg = { role: 'assistant', content: '', timestamp: new Date().toLocaleTimeString() };
            chat.messages.push(assistantMsg);
            const msgIndex = chat.messages.length - 1;

            toggleLoading(true);
            scrollToBottom();

            state.abortController = new AbortController();

            try {
                const response = await fetch('https://api.mistral.ai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${state.apiKey}`
                    },
                    body: JSON.stringify({
                        model: document.getElementById('model-select').value,
                        messages: apiMessages,
                        temperature: parseFloat(document.getElementById('temperature').value),
                        max_tokens: 4096,
                        stream: true
                    }),
                    signal: state.abortController.signal
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || `HTTP Error ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let streamBuffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    streamBuffer += decoder.decode(value, { stream: true });
                    const lines = streamBuffer.split("\n");
                    streamBuffer = lines.pop();

                    for (const line of lines) {
                        const cleaned = line.replace(/^data: /, "").trim();
                        if (cleaned === "" || cleaned === "[DONE]") continue;

                        try {
                            const parsed = JSON.parse(cleaned);
                            const chunk = parsed.choices[0]?.delta?.content || "";
                            assistantMsg.content += chunk;

                            const estMsgTokens = Math.max(1, Math.ceil(assistantMsg.content.length / 4));
                            const limitDisplay = state.customLimit > 0 ? state.customLimit : "Unlimited";
                            assistantMsg.usage = `+${estMsgTokens} - ${state.tokensUsedToday + estMsgTokens}/${limitDisplay} used`;

                            // Check Custom Token Limit Mid-Stream
                            if (state.customLimit > 0 && (state.tokensUsedToday + estMsgTokens) >= state.customLimit) {
                                state.abortController.abort();
                                assistantMsg.content += "\n\n**Token limit reached.**";
                                break;
                            }

                            // Smooth non-flashing stream update
                            updateStreamingMessageUI(msgIndex, assistantMsg);
                            if (state.autoScroll) scrollToBottom();

                        } catch (e) {
                            console.error("Stream parsing error:", e);
                        }
                    }
                }

                // Finalize Token Count
                const finalTokens = Math.max(1, Math.ceil(assistantMsg.content.length / 4));
                state.tokensUsedToday += finalTokens;

                const limitDisplay = state.customLimit > 0 ? state.customLimit : "Unlimited";
                assistantMsg.usage = `+${finalTokens} - ${state.tokensUsedToday}/${limitDisplay} used`;

                saveState();
                updateStreamingMessageUI(msgIndex, assistantMsg);

            } catch (err) {
                if (err.name === 'AbortError') {
                    assistantMsg.content += ' *(Generation Stopped)*';
                } else {
                    assistantMsg.content = `⚠️ **Error:** ${err.message}`;
                }
                saveState();
                updateStreamingMessageUI(msgIndex, assistantMsg);
            } finally {
                toggleLoading(false);
            }
        }

        function stopGeneration() {
            if (state.abortController) state.abortController.abort();
        }

        function regenerateMessage(index) {
            const chat = getCurrentChat();
            if (!chat) return;
            chat.messages.splice(index, 1);
            saveState();
            renderMessages();
            executeStream(chat);
        }

        function deleteMessage(index) {
            const chat = getCurrentChat();
            if (!chat) return;
            chat.messages.splice(index, 1);
            saveState();
            renderMessages();
        }

        function copyMessage(index) {
            const chat = getCurrentChat();
            if (!chat) return;
            navigator.clipboard.writeText(chat.messages[index].content);
        }

        // --- Settings Modal Handlers ---
        function toggleSettingsModal(forceOpen = false) {
            const modal = document.getElementById('settings-modal');
            if (forceOpen) {
                modal.style.display = 'flex';
            } else {
                modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
            }
        }

        function saveAndCloseSettings() {
            const limitVal = parseInt(document.getElementById('token-limit-input').value, 10);
            state.customLimit = isNaN(limitVal) || limitVal < 0 ? 0 : limitVal;
            saveState();
            renderMessages();
            toggleSettingsModal(false);
        }

        // --- Import / Export / Helpers ---
        function exportChat() {
            const chat = getCurrentChat();
            if (!chat) return;
            const blob = new Blob([JSON.stringify(chat, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL ? URL.createObjectURL(blob) : window.webkitURL.createObjectURL(blob);
            a.download = `${chat.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.json`;
            a.click();
        }

        function importChat() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'application/json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (imported.messages && Array.isArray(imported.messages)) {
                            imported.id = Date.now().toString();
                            state.chats.unshift(imported);
                            saveState();
                            renderChatList();
                            switchChat(imported.id);
                            toggleSettingsModal(false);
                        }
                    } catch (err) {
                        alert('Invalid JSON chat file format.');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            document.getElementById('hljs-theme').href = next === 'dark' 
                ? 'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css'
                : 'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css';
        }

        function toggleLoading(isLoading) {
            if (isLoading) {
                sendBtn.classList.add('hidden');
                stopBtn.classList.remove('hidden');
            } else {
                sendBtn.classList.remove('hidden');
                stopBtn.classList.add('hidden');
            }
        }

        function scrollToBottom() {
            if (state.autoScroll) {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
